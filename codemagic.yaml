workflows:
  ios-workflow:
    name: Neon Merge iOS
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.neonmerge.app"
        XCODE_BUILD_CONFIGURATION: "Release"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
scripts:
  - name: Install npm dependencies
    script: |
      npm install
  - name: Sync Capacitor
    script: |
      npx cap sync ios
  - name: Build iOS app
    script: |
      xcodebuild build \
        -workspace "ios/App/App.xcworkspace" \
        -scheme "App" \
        -configuration Release \
        -destination "generic/platform=iOS" \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        | xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - danilmihryukov@gmail.com
        notify:
          success: true
          failure: true