workflows:
  ios-workflow:
    name: Neon Merge iOS
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.neonmerge.app"
        XCODE_BUILD_CONFIGURATION: "Release"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Fix permissions for Capacitor CLI
        script: |
          chmod +x node_modules/.bin/cap
          chmod +x node_modules/.bin/capacitor
          chmod -R +x node_modules/.bin/
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Build iOS app
        script: |
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$XCODE_BUILD_CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            SWIFT_ACTIVE_EXECUTION_ENVIRONMENT=NO \
            | xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - danilmihryukov@gmail.com
        notify:
          success: true
          failure: true